# Decap / Sveltia CMS configuration
# Docs: https://decapcms.org/docs/configuration-options/
#
# Lives at /family/manage (behind the family hub sign-in; /admin redirects
# here). Only blog posts and the class list are editable here. Everything
# else on the site (homepage, about, projects, resume) is hard-coded in the
# HTML files.
#
# OAuth proxy lives at /api/auth and /api/callback (Vercel serverless
# functions). GitHub OAuth app's callback URL must point at
# https://www.loganbrandall.com/api/callback. Env vars GITHUB_CLIENT_ID
# and GITHUB_CLIENT_SECRET must be set in Vercel.

backend:
  name: github
  repo: Logoo24/Personal-Site
  branch: main
  base_url: https://www.loganbrandall.com
  auth_endpoint: api/auth

# Where uploaded images go
media_folder: "images/uploads"
public_folder: "/images/uploads"

# Shrink photos as they're uploaded (phone photos are far bigger than a
# blog post needs). Sveltia CMS feature; SVGs and GIFs are left alone.
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
          height: 1600

# Preview links while editing posts
show_preview_links: true

collections:
  - name: "posts"
    label: "Blog posts"
    label_singular: "Post"
    description: "Write and edit blog posts. Personal posts show on the main blog; class posts show on their class's page (pick one under Post to)."
    folder: "_posts"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date | date('MMM D, YYYY')}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      # One choice for where the post goes: the personal blog or a class.
      # Each choice brings only the questions that apply to it (HUM 202 asks
      # which section of its page). build.js writes the list below from
      # _data/classes.json and each class page's sections on every build.
      - label: "Post to"
        name: "postTo"
        widget: "object"
        hint: "The personal blog, or the class this post is for. Add new classes under Classes in the sidebar; they appear here about a minute later, once the site has rebuilt (reload this page)."
        types:
          # POST_TO_TYPES_START
          - { name: "personal", label: "Personal blog" }
          - name: "hum-202"
            label: "HUM 202 · Searching for Meaning in the Modern World"
            fields:
              - label: "Section on the class page"
                name: "section"
                widget: "select"
                default: "essays"
                hint: "Where its card goes on the HUM 202 page. A post that already has a card of its own there stays where that card is."
                options:
                  - { label: "Part 1 · Early Modern World", value: "early-modern" }
                  - { label: "Part 2 · 19th Century", value: "19th-century" }
                  - { label: "Part 3 · Personal Application Essays", value: "essays" }
          - { name: "mkt-353", label: "MKT 353 · Web Business Creation (past class)" }
          # POST_TO_TYPES_END
      - { label: "Short summary", name: "summary", widget: "string", hint: "1–2 sentences shown on the blog list page and in search engines." }
      - { label: "Reading time (minutes)", name: "readMinutes", widget: "number", default: 4, value_type: "int", min: 1, max: 90 }
      - { label: "Hide as draft", name: "draft", widget: "boolean", default: false, required: false, hint: "Check this to keep a post out of the live site while you finish writing it." }
      - { label: "In progress", name: "inProgress", widget: "boolean", default: false, required: false, hint: "Puts the page live at its link but keeps it out of post lists, homepage counts and the sitemap (like the HUM 202 portfolio's 19th Century pages). Uncheck it once the page is written." }
      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Images: insert one, then type left, right or center in its Title box to place it (left/right wrap the text around it). Add a caption after a colon, e.g. right: Our storefront."

  - name: "settings"
    label: "Classes"
    description: "Each class gets its own page, a spot in the Blog menu and a choice under a post's Post to (once the site has rebuilt, about a minute after saving). When you finish a class, switch on Finished to move it under Past classes."
    files:
      - name: "classes"
        label: "Class list"
        file: "_data/classes.json"
        fields:
          - label: "Classes"
            name: "classes"
            widget: "list"
            summary: "{{fields.code}} — {{fields.name}}"
            fields:
              - { label: "Class code", name: "code", widget: "string", hint: "e.g. MKT 353. Used in the page address, so avoid changing it once posts use it." }
              - { label: "Class name", name: "name", widget: "string", required: false, hint: "e.g. Web Business Creation" }
              - { label: "Finished (move to Past classes)", name: "archived", widget: "boolean", default: false, required: false }
