<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('lb-theme')||'light')}catch(e){}</script>
  <title>Documents · Randall Family</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#FAFAFA" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231F7A4D'/%3E%3Cpath d='M8 15 16 8l8 7v9h-5.5v-6h-5v6H8z' fill='%23FAFAFA'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/family/assets/hub.css" />
  <link rel="stylesheet" href="/family/documents/docs.css" />
</head>
<body class="hub">
  <header class="hub-bar" data-crumbs='[["Documents","/family/documents"]]'></header>

  <main class="hub-main">
    <div id="view"><p class="hub-loading">Opening…</p></div>
  </main>

  <script src="/family/assets/hub.js"></script>
  <script src="/family/documents/docs.js"></script>
  <script>
  (function () {
    var $ = Hub.$, esc = Hub.esc, I = Hub.icons;
    var id = new URLSearchParams(location.search).get('id');
    var doc = null, drive = null, related = [], at = 0;
    // The browse-page list this item was opened from (Docs.saveList), if it's in it.
    var ctx = Docs.savedList();
    var pos = ctx ? ctx.ids.indexOf(id) : -1;
    var itemHref = function (i) { return '/family/documents/item?id=' + encodeURIComponent(i); };

    function backHref() {
      return pos > -1 ? ctx.url : '/family/documents' + (doc ? '?c=' + doc.collection : '');
    }

    /* ---------- the list it came from: back, and "2 of 5" ---------- */
    function listNav() {
      if (pos < 0) return '';
      var prev = ctx.ids[pos - 1], next = ctx.ids[pos + 1];
      var step = function (to, icon, label) {
        return to ? '<a href="' + itemHref(to) + '" aria-label="' + label + '">' + icon + '</a>' : '<span class="is-off" aria-hidden="true">' + icon + '</span>';
      };
      return '<nav class="dc-listnav" aria-label="List">' +
        '<a class="dc-back" href="' + esc(ctx.url) + '">' + I.left + '<span>' + esc(ctx.label) + '</span></a>' +
        (ctx.ids.length > 1 ? '<span class="dc-pos">' + step(prev, I.left, 'Previous') + '<span>' + (pos + 1) + ' of ' + ctx.ids.length + '</span>' + step(next, I.right, 'Next') + '</span>' : '') +
        '</nav>';
    }
    // In "Still to thank" or "Check details", finishing one goes on to the
    // next (or back to the list after the last). kind is 'thank' or 'review'.
    function advance(kind, msg) {
      if (pos < 0 || ctx.f !== kind) return false;
      Docs.flash(msg);
      var next = ctx.ids[pos + 1];
      location.href = next ? itemHref(next) : ctx.url;
      return true;
    }

    /* ---------- photos and files ---------- */
    function stage() {
      var files = doc.files;
      if (!files.length) {
        var c = Docs.coll(doc.collection);
        return '<div class="dc-stage"><div class="dc-stage-empty">' + I[doc.gift ? 'gift' : c.icon] + '<p>' +
          (doc.collection === 'cards' && doc.gift ? 'A gift, recorded without a photo.' : 'No photo or file yet.') + '</p></div></div>';
      }
      var f = files[at], k = Docs.kind(f), html;
      if (k === 'image') {
        html = '<img src="' + esc(f.url) + '" alt="" data-zoom />';
      } else {
        html = '<div class="dc-stage-file">' +
          (f.thumbUrl ? '<img src="' + esc(f.thumbUrl) + '" alt="" data-open />' : '<span class="dc-big-icon">' + I.file + '</span>') +
          '<strong>' + esc(f.name) + '</strong><span>' + [k === 'pdf' ? (f.pages ? Hub.plural(f.pages, 'page') : 'PDF') : f.type, Docs.fileSize(f.size)].filter(Boolean).map(esc).join(' · ') + '</span>' +
          '<button class="btn btn-primary btn-sm" type="button" data-open>' + I.external + (k === 'pdf' ? 'Open PDF' : 'Download') + '</button></div>';
      }
      var nav = files.length > 1
        ? '<button class="dc-nav dc-nav--prev" type="button" data-step="-1" aria-label="Previous">' + I.left + '</button><button class="dc-nav dc-nav--next" type="button" data-step="1" aria-label="Next">' + I.right + '</button>'
        : '';
      return '<div class="dc-stage">' + html + nav + '</div>';
    }
    function strip() {
      if (doc.files.length < 2) return '';
      return '<div class="dc-strip">' + doc.files.map(function (f, i) {
        return '<button type="button" data-at="' + i + '"' + (i === at ? ' class="on"' : '') + ' aria-label="' + esc(f.name) + '">' +
          (f.thumbUrl ? '<img src="' + esc(f.thumbUrl) + '" alt="" loading="lazy" />' : I.file) + '</button>';
      }).join('') + '</div>';
    }
    function mediaActions() {
      if (!doc.files.length) return '';
      var f = doc.files[at];
      return '<div class="dc-media-actions">' +
        '<button class="btn btn-ghost btn-sm" type="button" data-download>' + I.download + 'Download</button>' +
        (f.driveUrl && drive && drive.mine ? '<a class="btn btn-ghost btn-sm" href="' + esc(f.driveUrl) + '" target="_blank" rel="noopener">' + I.external + 'Open in Google Drive</a>' : '') +
        '</div>';
    }
    function drawMedia() {
      $('#media').innerHTML = stage() + strip() + mediaActions();
    }

    /* ---------- details ---------- */
    function facts() {
      var rows = [], c = Docs.coll(doc.collection);
      var add = function (label, value, extra) { if (value) rows.push('<dt>' + esc(label) + '</dt><dd>' + esc(value) + (extra || '') + '</dd>'); };
      if (doc.title) add('From', doc.from);
      add(c.catLabel, doc.category);
      add(doc.collection === 'receipts' || doc.collection === 'manuals' ? 'Bought' : 'Date', Docs.dateLabel(doc.date));
      add('Gift', doc.gift);
      add('Store', doc.title ? doc.store : '');
      add('Total', Docs.money(doc.total));
      add('Brand', doc.brand);
      add('Model', doc.model);
      if (doc.warrantyUntil) {
        var w = Docs.warranty(doc);
        add('Warranty until', Docs.dateLabel(doc.warrantyUntil),
          '<span class="dc-badge' + (w === 'soon' ? ' dc-badge--thank">Ends soon' : w === 'active' ? ' dc-badge--done">Active' : '">Ended') + '</span>');
      }
      if (doc.sourceUrl) {
        var host = doc.sourceUrl.replace(/^https?:\/\/(www\.)?/i, '').split('/')[0];
        rows.push('<dt>Online</dt><dd><a class="dc-link" href="' + esc(doc.sourceUrl) + '" target="_blank" rel="noopener">' + esc(host) + ' ↗</a></dd>');
      }
      return rows.length ? '<dl class="dc-facts">' + rows.join('') + '</dl>' : '';
    }
    // Three states: thanked; still to thank; no thank-you needed.
    function thankedBox() {
      if (doc.collection !== 'cards') return '';
      if (doc.thanked) {
        return '<div class="dc-thanked is-done"><p><strong>Thanked</strong>' + (doc.thankedOn ? 'Marked on ' + esc(Docs.dateLabel(doc.thankedOn)) : '') + '</p>' +
          '<button class="btn btn-ghost btn-sm" type="button" data-thanked="0">Not yet, actually</button></div>';
      }
      if (doc.toThank) {
        return '<div class="dc-thanked"><p><strong>Not thanked yet</strong>Mark it once you’ve sent a note or reached out' + (doc.from ? ' to ' + esc(doc.from) : '') + '.</p>' +
          '<div class="dc-thanked-btns"><button class="btn btn-primary btn-sm" type="button" data-thanked="1">' + I.check + 'We’ve thanked them</button>' +
          '<button class="link" type="button" data-needs="0">Doesn’t need one</button></div></div>';
      }
      return '<div class="dc-thanked is-none"><p><strong>No thank-you needed</strong>It isn’t on the Still to thank list.</p>' +
        '<button class="btn btn-ghost btn-sm" type="button" data-needs="1">' + I.mail + 'Needs a thank-you</button></div>';
    }
    function reviewBox() {
      if (!doc.needsReview) return '';
      var next = pos > -1 && ctx.f === 'review' && ctx.ids[pos + 1];
      return '<div class="dc-review">' + I.sparkle + '<p>These details were filled in from the picture. Check them over, then mark it done.</p>' +
        '<a class="btn btn-ghost btn-sm" href="/family/documents/edit?id=' + encodeURIComponent(doc.id) + '">Edit</a>' +
        '<button class="btn btn-primary btn-sm" type="button" data-reviewed>' + I.check + (next ? 'Looks right, next' : 'Looks right') + '</button></div>';
    }
    // A receipt and its manual (the same model number).
    function relatedBlock() {
      if (!related.length) return '';
      return '<section class="dc-block"><h2>Also kept for this model</h2><div class="dc-related">' + related.map(function (r) {
        var c = Docs.coll(r.collection), sub = Docs.subline(r);
        return '<a class="dc-rel dc--' + esc(r.collection) + '" href="' + itemHref(r.id) + '">' +
          '<span class="dc-rel-pic">' + (r.thumbUrl ? '<img src="' + esc(r.thumbUrl) + '" alt="" loading="lazy" />' : I[c.icon]) + '</span>' +
          '<span><strong>' + esc(r.name) + '</strong><small>' + esc(c.one + (sub ? ' · ' + sub : '')) + '</small></span></a>';
      }).join('') + '</div></section>';
    }
    function textHeading() {
      return { cards: 'What it says', manuals: 'Summary', receipts: 'Items', other: 'Details' }[doc.collection];
    }

    /* ---------- text from the pages ----------
       Every page's text of its PDFs (what search looks through), folded
       away under the details. It stays open across re-draws. */
    var pagesOpen = false;
    function pagesBlock() {
      var withText = doc.files.filter(function (f) { return f.text; });
      if (!withText.length) return '';
      var words = withText.reduce(function (n, f) { return n + f.text.split(/\s+/).length; }, 0);
      return '<details class="dc-block dc-pages"' + (pagesOpen ? ' open' : '') + '><summary><h2>Text from the pages</h2>' +
          '<span class="dc-pages-count">' + words.toLocaleString('en-US') + (words === 1 ? ' word' : ' words') + '</span>' + I.down + '</summary>' +
        '<p class="dc-pages-hint">Read from the pages, so search can find any word on them. Scanned pages can have a few misread words.</p>' +
        withText.map(function (f) {
          return (withText.length > 1 ? '<h3>' + esc(f.name) + '</h3>' : '') + '<div class="dc-text dc-text--pages">' + esc(f.text) + '</div>';
        }).join('') +
      '</details>';
    }
    function drawPages() { var el = $('#pages-text'); if (el) el.innerHTML = pagesBlock(); }
    $('#view').addEventListener('toggle', function (e) { if (e.target.matches('.dc-pages')) pagesOpen = e.target.open; }, true);

    // A PDF saved before page text was kept: read its text here, once, so
    // search finds its words too. It has to be downloaded, so not one over
    // 20 MB. Nothing is written if it can't be fetched (it's tried again
    // next time); a damaged PDF is saved as having no text.
    function fillPageText() {
      var todo = doc.files.filter(function (f) { return Docs.kind(f) === 'pdf' && typeof f.text !== 'string' && (f.size || 0) <= 20e6; });
      if (!todo.length) return;
      todo.reduce(function (chain, f) {
        return chain.then(function (list) {
          return Docs.storedPdfText(f).then(function (t) { list.push({ id: f.id, store: f.store, text: t }); return list; }, function () { return list; });
        });
      }, Promise.resolve([])).then(function (list) {
        if (!list.length) return;
        return Hub.api('docs-patch', { body: { id: doc.id, fileText: list } }).then(function (r) {
          doc.files = r.doc.files;
          drawPages();
        });
      }).catch(function () { /* tried again next time */ });
    }

    function render() {
      var c = Docs.coll(doc.collection);
      document.title = doc.name + ' · Documents · Randall Family';
      var sub = [];
      if (!doc.title && doc.collection === 'receipts') sub.push(Docs.money(doc.total), Docs.dateLabel(doc.date));
      // Head, photo, then the rest: on a phone the name and the buttons come
      // before the photo, which would otherwise fill the screen.
      $('#view').innerHTML =
        '<div class="dc-item dc--' + doc.collection + '">' +
          '<div class="dc-head">' +
            listNav() +
            // (not when the back link above already says "Cards & gifts")
            (pos > -1 && ctx.label === c.label ? '' : '<a class="dc-eyebrow" href="/family/documents?c=' + doc.collection + '">' + I[c.icon] + esc(c.label) + '</a>') +
            '<h1 class="dc-title">' + esc(doc.name) + '</h1>' +
            (sub.filter(Boolean).length ? '<p class="dc-sub">' + esc(sub.filter(Boolean).join(' · ')) + '</p>' : '') +
            reviewBox() +
            thankedBox() +
          '</div>' +
          '<div class="dc-media" id="media"></div>' +
          '<div class="dc-body">' +
            facts() +
            (doc.text ? '<section class="dc-block"><h2>' + textHeading() + '</h2><div class="dc-text' + (doc.collection === 'cards' ? ' dc-text--card' : '') + '">' + esc(doc.text) + '</div></section>' : '') +
            (doc.notes ? '<section class="dc-block"><h2>Notes</h2><div class="dc-text">' + esc(doc.notes) + '</div></section>' : '') +
            '<div id="pages-text">' + pagesBlock() + '</div>' +
            relatedBlock() +
            '<div class="dc-actions">' +
              '<a class="btn btn-ghost" href="/family/documents/edit?id=' + encodeURIComponent(doc.id) + '">' + I.edit + 'Edit</a>' +
              '<button class="btn btn-danger" type="button" data-delete>' + I.trash + 'Delete</button>' +
            '</div>' +
            '<p class="dc-byline">Added by ' + esc(doc.createdBy || 'someone') + ' on ' + esc(new Date(doc.createdAt).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })) +
              (doc.updatedBy && doc.updatedAt !== doc.createdAt ? ' · last changed by ' + esc(doc.updatedBy) : '') + '</p>' +
          '</div>' +
        '</div>';
      drawMedia();
    }

    // kind: 'thank' or 'review' goes on to the next one in that list.
    function patch(body, done, kind) {
      body.id = doc.id;
      return Hub.api('docs-patch', { body: body }).then(function (r) {
        doc = r.doc;
        if (kind && advance(kind, done)) return;
        render();
        if (done) Hub.toast(done);
      }).catch(function (e) { Hub.toast(e.message, true); render(); });
    }

    /* ---------- full-size photo ---------- */
    function lightbox() {
      var images = doc.files.filter(function (f) { return Docs.kind(f) === 'image'; });
      var i = Math.max(0, images.indexOf(doc.files[at]));
      var m = document.createElement('div');
      m.className = 'dc-light';
      function draw() {
        var f = images[i];
        m.innerHTML = '<div class="dc-light-bar">' +
          '<a href="' + esc(Docs.href(f)) + '" target="_blank" rel="noopener" aria-label="Open the original">' + I.external + '</a>' +
          '<button type="button" data-x aria-label="Close">' + I.x + '</button></div>' +
          '<img src="' + esc(f.url) + '" alt="" />' +
          (images.length > 1 ? '<button class="dc-nav dc-nav--prev" type="button" data-s="-1" aria-label="Previous">' + I.left + '</button><button class="dc-nav dc-nav--next" type="button" data-s="1" aria-label="Next">' + I.right + '</button>' : '');
      }
      function close() { m.remove(); document.removeEventListener('keydown', key); }
      function move(s) { i = (i + s + images.length) % images.length; draw(); }
      function key(e) {
        if (e.key === 'Escape') close();
        else if (e.key === 'ArrowLeft' && images.length > 1) move(-1);
        else if (e.key === 'ArrowRight' && images.length > 1) move(1);
      }
      m.addEventListener('click', function (e) {
        var s = e.target.closest('[data-s]');
        if (s) return move(+s.getAttribute('data-s'));
        if (e.target.closest('[data-x]') || e.target === m) close();
      });
      document.addEventListener('keydown', key);
      draw();
      document.body.appendChild(m);
    }

    /* ---------- actions ---------- */
    $('#view').addEventListener('click', function (e) {
      var t;
      if ((t = e.target.closest('[data-step]'))) { at = (at + +t.getAttribute('data-step') + doc.files.length) % doc.files.length; drawMedia(); }
      else if ((t = e.target.closest('[data-at]'))) { at = +t.getAttribute('data-at'); drawMedia(); }
      else if (e.target.closest('[data-zoom]')) lightbox();
      else if (e.target.closest('[data-open]')) Docs.openFile(doc.files[at], false);
      else if (e.target.closest('[data-download]')) Docs.openFile(doc.files[at], true);
      else if ((t = e.target.closest('[data-thanked]'))) {
        t.disabled = true;
        var yes = t.getAttribute('data-thanked') === '1';
        patch(yes ? { thanked: true } : { thanked: false, needsThanks: true }, yes ? 'Marked as thanked.' : null, yes ? 'thank' : null);
      }
      else if ((t = e.target.closest('[data-needs]'))) {
        t.disabled = true;
        var needs = t.getAttribute('data-needs') === '1';
        patch({ needsThanks: needs }, needs ? 'Added to Still to thank.' : 'Taken off Still to thank.', needs ? null : 'thank');
      }
      else if ((t = e.target.closest('[data-reviewed]'))) { t.disabled = true; patch({ needsReview: false }, 'Marked as checked.', 'review'); }
      else if (e.target.closest('[data-delete]')) {
        var n = doc.files.length;
        Hub.confirm({
          title: 'Delete “' + doc.name + '”?', confirm: 'Delete', danger: true,
          body: '<p>This removes it from Documents for both of you.' + (n ? ' Its ' + (n === 1 ? 'file goes' : n + ' files go') + ' to Google Drive’s trash, where ' + (n === 1 ? 'it stays' : 'they stay') + ' for 30 days.' : '') + '</p>'
        }).then(function (yes) {
          if (!yes) return;
          Hub.api('docs-delete', { body: { id: doc.id } }).then(function () { location.href = backHref(); })
            .catch(function (err) { Hub.toast(err.message, true); });
        });
      }
    });
    document.addEventListener('keydown', function (e) {
      if (!doc || doc.files.length < 2 || document.querySelector('.dc-light, .hub-modal') || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { at = (at + (e.key === 'ArrowLeft' ? -1 : 1) + doc.files.length) % doc.files.length; drawMedia(); }
    });

    Hub.ready(function () {
      if (!id) { location.href = '/family/documents'; return; }
      Hub.api('docs-get', { query: { id: id } }).then(function (r) {
        doc = r.doc; drive = r.drive; related = r.related || [];
        render();
        Docs.showFlash();
        if (drive && !drive.connected && !drive.local && doc.files.some(function (f) { return f.store === 'drive'; })) {
          $('#view').insertAdjacentHTML('afterbegin', Docs.driveNote(drive));
        } else fillPageText();
      }).catch(function (e) {
        $('#view').innerHTML = '<div class="hub-empty"><h3>Couldn’t open this</h3><p>' + esc(e.message) + '</p><a class="btn btn-ghost" href="' + esc(backHref()) + '">Back to Documents</a></div>';
      });
    });
  })();
  </script>
</body>
</html>
