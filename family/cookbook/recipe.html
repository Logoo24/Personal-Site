<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('lb-theme')||'light')}catch(e){}</script>
  <title>Recipe · Randall Family</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#FAFAFA" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231F7A4D'/%3E%3Cpath d='M8 15 16 8l8 7v9h-5.5v-6h-5v6H8z' fill='%23FAFAFA'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/family/assets/hub.css" />
</head>
<body class="hub">
  <header class="hub-bar" data-crumbs='[["Cookbook","/family/cookbook"]]'></header>

  <main class="hub-main">
    <div class="hub-head no-print" style="margin-bottom:1.5rem">
      <a class="btn btn-ghost btn-sm" id="back" href="/family/cookbook">← All recipes</a>
      <div class="hub-actions" id="actions" hidden>
        <button class="btn btn-ghost" type="button" id="print">Print / PDF</button>
        <a class="btn btn-primary" id="edit" href="#">Edit</a>
      </div>
    </div>
    <div class="rc-want no-print" id="want" hidden></div>
    <div class="rc-share" id="share" hidden></div>
    <article id="recipe"><p class="hub-loading">Getting the recipe…</p></article>
    <p class="rc-byline no-print" id="byline"></p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="/js/recipe-scale.js"></script>
  <script src="/family/assets/hub.js"></script>
  <script>
  (function () {
    var $ = Hub.$, esc = Hub.esc;
    var id = new URLSearchParams(location.search).get('id');
    var recipe, factor = 1, wakeLock = null;
    $('#print').insertAdjacentHTML('afterbegin', Hub.icons.print);
    $('#edit').insertAdjacentHTML('afterbegin', Hub.icons.edit);

    function render() {
      $('#recipe').innerHTML = Hub.recipeHTML(recipe, { factor: factor, interactive: true });
      document.title = recipe.title + ' · Randall Family';
      renderWant();
    }

    /* ---------- "Want to make" ---------- */
    function renderWant() {
      var want = Hub.isWant(recipe);
      $('#want').hidden = !want;
      $('#back').textContent = want ? '← ' + Hub.WANT_TAG : '← All recipes';
      $('#back').href = '/family/cookbook' + (want ? '?tag=' + encodeURIComponent(Hub.WANT_TAG) : '');
      if (want) {
        $('#want').innerHTML = '<div class="rc-want-text">' + Hub.icons.bookmark + '<span><strong>On the “' + esc(Hub.WANT_TAG) + '” list</strong> · it isn’t in the cookbook yet</span></div>' +
          '<button class="btn btn-primary btn-sm" type="button" id="made-it">We made it! Add to cookbook</button>';
      }
    }
    $('#want').addEventListener('click', function (e) {
      var b = e.target.closest('#made-it');
      if (!b) return;
      b.disabled = true; b.textContent = 'Adding…';
      var tags = (recipe.tags || []).filter(function (t) { return !Hub.isWantTag(t); });
      Hub.api('recipe', { body: Object.assign({}, recipe, { tags: tags }) }).then(function (res) {
        recipe = res.recipe;
        render();
        Hub.toast('Added to the cookbook.');
      }).catch(function (err) {
        b.disabled = false; b.textContent = 'We made it! Add to cookbook';
        Hub.toast(err.message, true);
      });
    });

    function setFactor(f) {
      if (!(f > 0)) return;
      factor = Math.min(f, 100);
      $('[data-ingredients]') && ($('[data-ingredients]').innerHTML = Hub.ingredientsHTML(recipe.ingredients, factor));
      var amount = recipe.servings * factor;
      var y = $('[data-yield]'); if (y) y.textContent = RecipeScale.formatNum(amount) + ' ' + (recipe.yieldUnit || 'servings');
      var input = $('[data-scale-input]'); if (input && document.activeElement !== input) input.value = +amount.toFixed(2);
      Hub.$$('[data-scale-factor]').forEach(function (c) { c.classList.toggle('on', +c.getAttribute('data-scale-factor') === factor); });
    }

    /* ---------- public link ----------
       Making a recipe public gives it a link (/recipes/<slug>) anyone can
       open. The page shows the latest version of the recipe, so there's
       nothing to update after editing. */
    function publicUrl() { return location.origin + '/recipes/' + recipe.published.slug; }
    function shortUrl() { return publicUrl().replace(/^https?:\/\/(www\.)?/, ''); }

    function renderShare() {
      var p = recipe.published, box = $('#share');
      box.hidden = false;
      box.classList.toggle('is-shared', !!p);
      box.innerHTML = p
        ? '<div class="rc-share-text"><span class="rc-share-dot"></span><span><strong>Public</strong> · anyone with the link can see it</span></div>' +
          '<div class="hub-actions"><button class="btn btn-ghost btn-sm" type="button" data-link-options>Link options</button>' +
            '<button class="btn btn-primary btn-sm" type="button" data-share-now>' + Hub.icons.share + 'Share</button></div>'
        : '<div class="rc-share-text"><span class="rc-share-dot"></span><span><strong>Private to the family</strong> · only people signed in here can see it</span></div>' +
          '<div class="hub-actions"><button class="btn btn-ghost btn-sm" type="button" data-make-public>' + Hub.icons.globe + 'Make public</button></div>';
    }

    function copyLink() {
      var url = publicUrl();
      var done = function () { Hub.toast('Link copied.'); };
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(url).then(done, function () { prompt('Copy this link:', url); });
      prompt('Copy this link:', url);
    }
    // The phone's own share sheet (Messages, group chats…), or copying the
    // link where there isn't one.
    function shareLink() {
      var data = { title: recipe.title, text: recipe.title + ' — from the Randall family kitchen', url: publicUrl() };
      if (navigator.share && (!navigator.canShare || navigator.canShare(data))) {
        return navigator.share(data).catch(function (e) { if (e && e.name !== 'AbortError') copyLink(); });
      }
      copyLink();
    }

    function setPublic(on, slug) {
      return Hub.api('publish', { body: { id: recipe.id, publish: on, slug: slug } }).then(function (data) {
        recipe = data.recipe;
        renderShare();
      });
    }

    // The pop-up: shown right after making a recipe public, and from "Link options".
    function linkDialog(justMadePublic) {
      var m = document.createElement('div');
      m.className = 'hub-modal';
      m.innerHTML = '<div class="hub-modal-box rc-link-box" role="dialog" aria-modal="true" aria-labelledby="rc-link-title">' +
        '<button class="rc-link-close" type="button" data-close aria-label="Close">' + Hub.icons.x + '</button>' +
        '<span class="rc-link-badge">' + Hub.icons.check + '</span>' +
        '<h3 id="rc-link-title">' + (justMadePublic ? 'Recipe made public' : 'This recipe is public') + '</h3>' +
        '<p>Anyone with the link can see the recipe, its story and photos. It isn’t listed anywhere on the site.</p>' +
        '<div class="rc-link" data-link-view><span class="rc-link-url"></span><button type="button" class="rc-link-edit" data-edit-slug>Edit</button></div>' +
        '<form class="rc-link rc-link-form" data-link-form hidden><span class="rc-link-prefix"></span>' +
          '<input class="input" name="slug" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Link name" />' +
          '<button class="btn btn-primary btn-sm" type="submit">Save</button><button class="btn btn-ghost btn-sm" type="button" data-cancel-edit>Cancel</button>' +
          '<small>The old link will stop working.</small></form>' +
        '<button class="btn btn-primary rc-link-share" type="button" data-share>' + Hub.icons.share + 'Share recipe</button>' +
        '<div class="rc-link-more">' +
          '<button class="btn btn-ghost btn-sm" type="button" data-copy>Copy link</button>' +
          '<a class="btn btn-ghost btn-sm" href="/family/cookbook/edit?id=' + encodeURIComponent(recipe.id) + '">' + Hub.icons.edit + 'Edit recipe</a>' +
          '<button class="btn btn-ghost btn-sm rc-link-private" type="button" data-private>' + Hub.icons.lock + 'Make private</button>' +
        '</div></div>';
      var view = $('[data-link-view]', m), form = $('[data-link-form]', m);
      function fillUrl() {
        $('.rc-link-url', m).textContent = shortUrl();
        $('.rc-link-prefix', m).textContent = shortUrl().replace(/[^/]*$/, '');
        form.elements.slug.value = recipe.published.slug;
      }
      function close() { m.remove(); document.removeEventListener('keydown', onKey); }
      function onKey(e) { if (e.key === 'Escape') close(); }
      function editing(on) { view.hidden = on; form.hidden = !on; if (on) { form.elements.slug.focus(); form.elements.slug.select(); } }
      fillUrl();
      m.addEventListener('click', function (e) {
        var t = e.target;
        if (t === m || t.closest('[data-close]')) return close();
        if (t.closest('[data-edit-slug]')) return editing(true);
        if (t.closest('[data-cancel-edit]')) { fillUrl(); return editing(false); }
        if (t.closest('[data-share]')) return shareLink();
        if (t.closest('[data-copy]')) return copyLink();
        var priv = t.closest('[data-private]');
        if (priv) {
          priv.disabled = true; priv.textContent = 'Making private…';
          setPublic(false).then(function () { close(); Hub.toast('The recipe is private again. Its link no longer works.'); })
            .catch(function (err) { priv.disabled = false; priv.innerHTML = Hub.icons.lock + 'Make private'; Hub.toast(err.message, true); });
        }
      });
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var slug = form.elements.slug.value.trim();
        if (!slug || slug === recipe.published.slug) { fillUrl(); return editing(false); }
        var save = $('[type=submit]', form);
        save.disabled = true;
        setPublic(true, slug).then(function () { fillUrl(); editing(false); Hub.toast('Link updated.'); })
          .catch(function (err) { Hub.toast(err.message, true); })
          .finally(function () { save.disabled = false; });
      });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(m);
      $('[data-share]', m).focus();
    }

    $('#share').addEventListener('click', function (e) {
      if (e.target.closest('[data-share-now]')) return shareLink();
      if (e.target.closest('[data-link-options]')) return linkDialog(false);
      var b = e.target.closest('[data-make-public]');
      if (!b) return;
      b.disabled = true; b.textContent = 'Making public…';
      setPublic(true).then(function () { linkDialog(true); })
        .catch(function (err) { Hub.toast(err.message, true); renderShare(); });
    });

    $('#recipe').addEventListener('click', function (e) {
      var t = e.target;
      var li = t.closest('.rc-ing-list li:not(.rc-ing-section), .rc-steps li');
      if (li && !t.closest('a')) li.classList.toggle('done');
      var f = t.closest('[data-scale-factor]');
      if (f) setFactor(+f.getAttribute('data-scale-factor'));
      var step = t.closest('[data-scale-step]');
      if (step) {
        var cur = recipe.servings * factor, d = +step.getAttribute('data-scale-step');
        var next = cur + d * (cur <= 2 ? 0.5 : 1);
        if (next > 0) setFactor(next / recipe.servings);
      }
    });
    $('#recipe').addEventListener('input', function (e) {
      if (e.target.matches('[data-scale-input]')) { var v = parseFloat(e.target.value); if (v > 0) setFactor(v / recipe.servings); }
    });
    $('#recipe').addEventListener('change', function (e) {
      if (!e.target.matches('[data-wake]')) return;
      if (e.target.checked) {
        navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; Hub.toast('Screen will stay on while this page is open.'); })
          .catch(function () { e.target.checked = false; Hub.toast('This browser won’t keep the screen on.', true); });
      } else if (wakeLock) { wakeLock.release(); wakeLock = null; }
    });
    document.addEventListener('visibilitychange', function () {
      var box = $('[data-wake]');
      if (document.visibilityState === 'visible' && box && box.checked && !wakeLock) navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(function () {});
      if (document.visibilityState === 'hidden') wakeLock = null;
    });
    $('#print').addEventListener('click', function () { window.print(); });

    Hub.ready(function () {
      if (!id) { location.replace('/family/cookbook'); return; }
      Hub.api('recipe', { query: { id: id } }).then(function (data) {
        recipe = data.recipe;
        $('#edit').href = '/family/cookbook/edit?id=' + encodeURIComponent(recipe.id);
        $('#actions').hidden = false;
        var crumb = document.createElement('span');
        crumb.className = 'hub-crumb';
        crumb.innerHTML = '<a href="' + location.pathname + location.search + '">' + esc(recipe.title) + '</a>';
        Hub.$$('.hub-crumb').pop().after(crumb);
        render();
        renderShare();
        var when = function (iso) { return new Date(iso).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }); };
        $('#byline').textContent = 'Added by ' + recipe.createdBy + ' on ' + when(recipe.createdAt) +
          (recipe.updatedAt !== recipe.createdAt ? ' · Last edited by ' + recipe.updatedBy + ' on ' + when(recipe.updatedAt) : '');
        if (new URLSearchParams(location.search).get('print')) setTimeout(function () { window.print(); }, 600);
      }).catch(function (e) {
        $('#recipe').innerHTML = '<div class="hub-empty"><h3>' + (e.status === 404 ? 'Recipe not found' : 'Couldn’t load the recipe') + '</h3><p>' + esc(e.message) + '</p><a class="btn btn-ghost" href="/family/cookbook">Back to the cookbook</a></div>';
      });
    });
  })();
  </script>
</body>
</html>
